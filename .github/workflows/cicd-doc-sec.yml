name: Document Retrieval Service - CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
   # Terraform
  TF_WORKING_DIRECTORY: terraform/infrastructure
  AWS_REGION: us-east-1
  ARTIFACT_BUCKET: blueeagle-prod-app-doc-artifacts
  ARTIFACT_NAME: document-retrieval-service.jar

jobs:
  build:
    name: Test, Build and Publish Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Run tests
        run: mvn -B test

      - name: Build application
        run: mvn -B -DskipTests clean package

      - name: Verify JAR
        run: |
          ls -lh target/
          test -f target/document-retrieval-service.jar


      # ------------------------------------------------------------
      # Authenticate GitHub Actions to AWS using OIDC
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::651706774390:role/gitactions-tf-role
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------
      # Publish immutable application artifact
      # ------------------------------------------------------------
      - name: Publish artifact to S3
        run: |
          aws s3 cp \
            target/${{ env.ARTIFACT_NAME }} \
            s3://${{ env.ARTIFACT_BUCKET }}/document-retrieval-service/${{ github.sha }}/${{ env.ARTIFACT_NAME }}
 
      # ------------------------------------------------------------
      # Verify artifact publication
      # ------------------------------------------------------------
      - name: Verify published artifact
        run: |
          aws s3 ls \
            s3://${{ env.ARTIFACT_BUCKET }}/document-retrieval-service/${{ github.sha }}/


      # ------------------------------------------------------------
      # Set up Terraform
      # ------------------------------------------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.1

      # ------------------------------------------------------------
      # Deploy infrastructure
      # ------------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        run: |
          terraform apply -auto-approve

      # ------------------------------------------------------------
      # Point deployment to the immutable artifact
      # ------------------------------------------------------------
      - name: Update deployed artifact version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ARTIFACT_KEY="document-retrieval-service/${GITHUB_SHA}/${ARTIFACT_NAME}"

          echo "Deploying artifact:"
          echo "${ARTIFACT_KEY}"

          aws ssm put-parameter \
            --name "/blueeagle/prod/document-retrieval-service/artifact-key" \
            --value "${ARTIFACT_KEY}" \
            --type "String" \
            --overwrite \
            --region "${AWS_REGION}"   



      # ------------------------------------------------------------
      # Start ASG instance refresh
      # ------------------------------------------------------------
      - name: Start ASG instance refresh
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Starting ASG instance refresh..."

          INSTANCE_REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "blueeagle-prod-app-asg" \
            --preferences MinHealthyPercentage=50,InstanceWarmup=60 \
            --region "${AWS_REGION}" \
            --query 'InstanceRefreshId' \
            --output text)

          echo "Instance refresh ID: ${INSTANCE_REFRESH_ID}"
          echo "INSTANCE_REFRESH_ID=${INSTANCE_REFRESH_ID}" >> "${GITHUB_ENV}"

      # ------------------------------------------------------------
      # Wait for ASG instance refresh
      # ------------------------------------------------------------
      - name: Wait for ASG instance refresh
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "Waiting for ASG instance refresh: ${INSTANCE_REFRESH_ID}"

          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "blueeagle-prod-app-asg" \
              --instance-refresh-ids "${INSTANCE_REFRESH_ID}" \
              --region "${AWS_REGION}" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Current refresh status: ${STATUS}"

            case "${STATUS}" in
              Successful)
                echo "ASG instance refresh completed successfully."
                break
                ;;

              Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                echo "ERROR: ASG instance refresh ended with status: ${STATUS}"
                exit 1
                ;;

              *)
                echo "Refresh still in progress..."
                sleep 15
                ;;
            esac
          done

      # ------------------------------------------------------------
      # ALB health validation
      # ------------------------------------------------------------
      - name: Validate ALB health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "blueeagle-prod-app-alb" \
            --region "${AWS_REGION}" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)

          echo "ALB DNS: ${ALB_DNS}"

          echo "Waiting for ALB health endpoint..."

          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              "http://${ALB_DNS}/health"; then
              echo ""
              echo "ALB health check passed."
              exit 0
            fi

            echo "Attempt ${attempt}/5 failed. Retrying in 10 seconds..."
            sleep 10
          done

          echo "ERROR: ALB health validation failed."
          exit 1

      # ------------------------------------------------------------
      # Document endpoint validation
      # ------------------------------------------------------------
      - name: Validate document endpoint
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "blueeagle-prod-app-alb" \
            --region "${AWS_REGION}" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)

          echo "ALB DNS: ${ALB_DNS}"

          echo "Testing document endpoint through ALB..."

          RESPONSE=$(curl --fail --silent --show-error \
          "http://${ALB_DNS}/documents/test-document.txt")

          echo "Document response:"
          echo "${RESPONSE}"

          if [ "${RESPONSE}" != "Hello from BlueEagle document retrieval service" ]; then
            echo "ERROR: Document endpoint returned unexpected content."
            exit 1
          fi

          echo "Document endpoint validation passed."

      # ------------------------------------------------------------
      # Deployment summary
      # ------------------------------------------------------------
      - name: Deployment summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "=============================================="
          echo "BlueEagle deployment completed successfully"
          echo "=============================================="
          echo "Artifact:"
          echo "document-retrieval-service/${GITHUB_SHA}/${ARTIFACT_NAME}"
          echo ""
          echo "Deployment sequence:"
          echo "1. Build"
          echo "2. Test"
          echo "3. Publish SHA artifact"
          echo "4. Terraform infrastructure"
          echo "5. Update SSM pointer"
          echo "6. Start ASG instance refresh"
          echo "7. Wait for refresh"
          echo "8. ALB health validation"
          echo "9. Document endpoint validation"
          echo "=============================================="      
            

          